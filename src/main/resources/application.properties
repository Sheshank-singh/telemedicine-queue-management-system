# ===================================================================
# Telemedicine Queue Management System (TQMS) Configuration
# Port 8081 keeps port 8080 open for Jenkins CI/CD server
# ===================================================================
server.port=8081
server.servlet.context-path=/

# Application Metadata
spring.application.name=telemedicine-queue-management-system

# Default Database Configuration: H2 In-Memory (Zero-setup local development & CI testing)
spring.datasource.url=jdbc:h2:mem:tqmsdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# MySQL Production Configuration (Activate via spring.profiles.active=mysql)
# spring.datasource.url=jdbc:mysql://localhost:3306/tqms?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
# spring.datasource.username=tqms
# spring.datasource.password=tqms_password
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Actuator Health Check Configuration (Used by Jenkins CI, Docker & Ansible health checks)
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# Thymeleaf Settings
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
