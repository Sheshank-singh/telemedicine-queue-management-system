[tqms_servers]
target-node ansible_host=localhost ansible_connection=local

[tqms_servers:vars]
ansible_python_interpreter=/usr/bin/python3
app_name=tqms
app_user=tqms
app_group=tqms
app_home=/opt/tqms
app_port=8081
app_war_source=../target/tqms.war
log_dir=/var/log/tqms
config_dir=/opt/tqms/config
java_package=openjdk-17-jre-headless
